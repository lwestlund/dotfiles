monitor.alsa.rules = [

  # CARDS -- disabled entirely

  {
    # Navi 48 GPU HDMI/DP audio (Odyssey G7). Disabled at card level rather
    # than per-sink: HDMI cards expose different sink nodes per profile, so a
    # node rule would only cover whichever sink happens to exist right now.
    matches: [
      {
        device.nick: "HDA ATI HDMI"
      }
    ]
    actions: {
      update-props: {
        device.disabled: true
      }
    }
  }
  {
    # Second GPU (Radeon) HDMI audio -- exposes no usable sinks.
    matches: [
      {
        device.nick: "HD-Audio Generic"
      }
    ]
    actions: {
      update-props: {
        device.disabled: true
      }
    }
  }

  # SINKS

  {
    # Matched on node.description, not node.name: the USB interface's node
    # names changed across a UCM update (HiFi__Mic1__source -> HiFi__Mic__source)
    # while the descriptions stayed put.
    matches: [
      {
        node.description: "USB Audio Speakers"
      }
    ],
    actions: {
      update-props: {
        node.nick: "Headphones"
        node.description: "Headphones"
      }
    }
  }
  {
    matches: [
      {
        node.description: "USB Audio S/PDIF Output"
      }
    ],
    actions: {
      update-props: {
        node.disabled: true
      }
    }
  }
  {
    matches: [
      {
        node.description: "USB Audio Front Headphones"
      }
    ],
    actions: {
      update-props: {
        node.disabled: true
      }
    }
  }

  # SOURCES

  {
    matches: [
      {
        node.description: "USB Audio Line Input"
      }
    ],
    actions: {
      update-props: {
        node.disabled: true
      }
    }
  }
  {
    matches: [
      {
        node.description: "USB Audio Microphone"
      }
    ],
    actions: {
      update-props: {
        node.disabled: true
      }
    }
  }
  {
    # Audio node only -- the C270's video device is v4l2 and unaffected.
    matches: [
      {
        node.description: "Webcam C270 Mono"
      }
    ],
    actions: {
      update-props: {
        node.disabled: true
      }
    }
  }
]
