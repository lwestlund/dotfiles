format = """
$username\
$hostname\
$localip\
$kubernetes\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$terraform\
$memory_usage\
$python\
$aws\
$gcloud\
$direnv\
$env_var\
$mise\
$sudo\
$cmd_duration\
$status\
$line_break\
$jobs\
$container\
$character"""

[python]
format = "${symbol}$virtualenv "

[aws]
symbol = "☁️ "
format = '[$symbol($profile)(\[$duration\] )]($style)'
[aws.profile_aliases]
"connectivity-dev@tools" = 'tools'
"connectivity-dev@test" = 'test'
"connectivity-dev@prod" = 'prod'

[git_branch]
symbol = "🌱 "

[git_commit]
tag_symbol = " 🏷 "
tag_disabled = false

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = '⇕[⇡${ahead_count}](green)[⇣${behind_count}](yellow)'

[status]
disabled = false
format = '[\[$common_meaning$signal_name$maybe_int\]]($style) '
