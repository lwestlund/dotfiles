# vim:fileencoding=utf-8:foldmethod=marker

font_family JetBrainsMono Nerd Font
# font_family Iosevka NF
font_size 10.0

shell_integration no-cursor
# cursor_shape block

# scroll
map page_up scroll_page_up
map page_down scroll_page_down

# change font size
map ctrl+plus change_font_size all +2.0
map ctrl+kp_add change_font_size all +2.0
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+kp_subtract change_font_size all -2.0
map ctrl+0 change_font_size all 0

# new term in cwd
map ctrl+shift+n launch --cwd=current --type=os-window

# search the scrollback within a pager
map ctrl+shift+/ search_scrollback

# browse output of last command in pager
map --allow-fallback=shifted,ascii ctrl+shift+g show_last_command_output
# scroll to previous prompt
map --allow-fallback=shifted,ascii ctrl+shift+z scroll_to_prompt -1
# scroll to next prompt
map --allow-fallback=shifted,ascii ctrl+shift+x scroll_to_prompt 1

# doom-one dark
