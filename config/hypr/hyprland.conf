# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

# Execute your favorite apps at launch
exec-once = hyprpaper
exec-once = systemctl --user start hyprland-session.target
exec-once = emote
exec-once = hypridle
exec-once = swaync

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

general {
    border_size = 1
    gaps_in = 4
    gaps_out = 4
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    rounding = 4

    shadow {
        enabled = no
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
         enabled = no
         size = 3
         passes = 1
         new_optimizations = on
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slide
}

input {
    kb_layout = us,se
    kb_options = grp:win_space_toggle, ctrl:nocaps

    repeat_rate = 25
    repeat_delay = 270

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.

    scroll_method = 2fg

    follow_mouse = 1

    touchpad {
        disable_while_typing = yes
        natural_scroll = yes
    }
}

gestures {
    workspace_swipe = on
    workspace_swipe_forever = yes
}

misc {
     disable_hyprland_logo = yes
     mouse_move_enables_dpms = yes
     key_press_enables_dpms = yes
}

binds {
    workspace_back_and_forth = yes
}

dwindle {
    pseudotile = yes
    preserve_split = yes # You probably want this
    force_split = 2
}

# Per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = mx-master-2s-mouse
    sensitivity = 0.0
    accel_profile = flat
}
device {
    name = corsair-corsair-gaming-m65-pro-rgb-mouse
    sensitivity = 0.0
    accel_profile = flat
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, Return, exec, alacritty
bind = $mod, C, killactive,
bind = $mod SHIFT, e, exit,
bind = $mod, E, exec, dolphin
bind = $mod, V, togglefloating,
bind = $mod, R, exec, pkill wofi || wofi --show drun
bind = $mod, P, pseudo, # dwindle
bind = $mod, T, togglesplit, # dwindle
bind = $mod, M, fullscreen, 0
bind = $mod CTRL, l, exec, hyprlock

# Resizing
bind = ALT, R, submap, resize
submap = resize
binde = , h, resizeactive, -20 0
binde = , l, resizeactive,  20 0
binde = , j, resizeactive,  0 20
binde = , k, resizeactive,  0 -20
bind = , escape, submap, reset
bind = ALT, R, submap, reset
submap = reset

# Move focus with mod + vim direction
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move windows with mod + shift + vim direction
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9] and move with it.
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace with mod + CTRL + [0-9] but don't move with it.
bind = $mod CTRL, 1, movetoworkspacesilent, 1
bind = $mod CTRL, 2, movetoworkspacesilent, 2
bind = $mod CTRL, 3, movetoworkspacesilent, 3
bind = $mod CTRL, 4, movetoworkspacesilent, 4
bind = $mod CTRL, 5, movetoworkspacesilent, 5
bind = $mod CTRL, 6, movetoworkspacesilent, 6
bind = $mod CTRL, 7, movetoworkspacesilent, 7
bind = $mod CTRL, 8, movetoworkspacesilent, 8
bind = $mod CTRL, 9, movetoworkspacesilent, 9
bind = $mod CTRL, 0, movetoworkspacesilent, 10

# Move/resize windows with mod + LMB/RMB and dragging.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindl=, switch:on:Lid Switch, exec, hyprlock

bindr=, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindr=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

bindr=, XF86AudioPlay, exec, playerctl play-pause
bindr=, XF86AudioNext, exec, playerctl next
bindr=, XF86AudioPrev, exec, playerctl previous

binde=, XF86MonBrightnessUp, exec, brightnessctl set 10%+
binde=, XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Capture screenshot from selection and copy to clip board.
bindr= SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

bind = CTRL ALT, e, exec, emote

bind = $mod SHIFT, n, exec, swaync-client --toggle-panel --skip-wait

windowrulev2 = tile, class:^(Spotify)$
