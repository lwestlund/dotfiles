general {
    hide_cursor = true
    grace = 3
}

background {
    monitor =
    path = $HOME/Pictures/wallpaper.jpg
}

auth {
    fingerprint {
        enabled = true
    }
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(200, 200, 200, 0.8)
    inner_color = rgba(150, 150, 150, 0.0)
    font_color = rgba(200, 200, 200, 0.8)
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = 🔒️ $FPRINTPROMPT # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS $FPRINTFAIL)</b></i> # can be set to empty
    fail_timeout = 2000
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = true # see below

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 100
    font_family = SF Pro Display

    position = 0, 50
    halign = center
    valign = center
}
