# See https://wiki.hyprland.org/Configuring/Monitors/
monitorv2 {
    output = eDP-1
    mode = preferred
    position = 0x0
    scale = 1
    bitdepth = 8
}

monitorv2 {
    output = HDMI-A-1
    mode = preferred
    position = auto
    scale = 1
    mirror = eDP-1
}

