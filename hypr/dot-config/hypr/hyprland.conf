source = ~/.config/hypr/$HOSTNAME.conf

# Execute your favorite apps at launch
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- blueman-applet

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

debug {
    disable_logs = false
}

general {
    border_size = 1
    gaps_in = 4
    gaps_out = 4
    col.active_border = rgba(ccccccee)
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 3

    shadow {
        enabled = no
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
         enabled = no
         size = 3
         passes = 1
         new_optimizations = on
    }
}

animations {
    enabled = yes

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick

    # animation = windows,       1,     7,     easeOutQuint
    # animation = windowsOut,    1,     7,     default,       popin 80%
    # animation = border,        1,     10,    default
    # animation = borderangle,   1,     8,     default
    # animation = fade,          1,     7,     default
    # animation = workspaces,    1,     6,     default,       slide

    # animation = zoomFactor,    1,     7,     quick
}

input {
    kb_layout = us,se
    kb_options = grp:win_space_toggle, ctrl:nocaps

    repeat_rate = 25
    repeat_delay = 270

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.

    scroll_method = 2fg

    follow_mouse = 1

    touchpad {
        disable_while_typing = yes
        natural_scroll = yes
    }
}

gesture = 3, horizontal, workspace
gesture = 2, pinchin, mod: $mod, dispatcher

misc {
     disable_hyprland_logo = yes
     mouse_move_enables_dpms = yes
     key_press_enables_dpms = yes
}

binds {
    workspace_back_and_forth = yes
    scroll_event_delay = 8
}

dwindle {
    pseudotile = yes
    preserve_split = yes # You probably want this
    force_split = 2
}

# Per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = logitech-wireless-mouse-mx-master-2s-1
    sensitivity = 0.0
    accel_profile = flat
}
device {
    name = corsair-corsair-gaming-m65-pro-rgb-mouse
    sensitivity = 0.0
    accel_profile = flat
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, Return, exec, alacritty
bind = $mod, S, togglespecialworkspace,
bind = $mod SHIFT, S, movetoworkspacesilent, special
bind = $mod, C, killactive,
bind = $mod SHIFT, e, exit,
bind = $mod, E, exec, dolphin
bind = $mod, V, togglefloating,
bind = $mod, R, exec, pkill wofi || wofi --show drun
bind = $mod, P, pseudo, # dwindle
bind = $mod, T, togglesplit, # dwindle
bind = $mod, M, fullscreen, 0
bind = $mod CTRL, l, exec, hyprlock

# Resizing
bind = ALT, R, submap, resize
submap = resize
binde = , h, resizeactive, -20 0
binde = , l, resizeactive,  20 0
binde = , j, resizeactive,  0 20
binde = , k, resizeactive,  0 -20
bind = , escape, submap, reset
bind = ALT, R, submap, reset
submap = reset

# Move focus with mod + vim direction
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move windows with mod + shift + vim direction
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9] and move with it.
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace with mod + CTRL + [0-9] but don't move with it.
bind = $mod CTRL, 1, movetoworkspacesilent, 1
bind = $mod CTRL, 2, movetoworkspacesilent, 2
bind = $mod CTRL, 3, movetoworkspacesilent, 3
bind = $mod CTRL, 4, movetoworkspacesilent, 4
bind = $mod CTRL, 5, movetoworkspacesilent, 5
bind = $mod CTRL, 6, movetoworkspacesilent, 6
bind = $mod CTRL, 7, movetoworkspacesilent, 7
bind = $mod CTRL, 8, movetoworkspacesilent, 8
bind = $mod CTRL, 9, movetoworkspacesilent, 9
bind = $mod CTRL, 0, movetoworkspacesilent, 10

# Move/resize windows with mod + LMB/RMB and dragging.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindl=, switch:on:Lid Switch, exec, hyprlock

bindr=, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindr=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

bindr=, XF86AudioPlay, exec, playerctl play-pause
bindr=, XF86AudioNext, exec, playerctl next
bindr=, XF86AudioPrev, exec, playerctl previous

binde=, XF86MonBrightnessUp, exec, brightnessctl set 10%+
binde=, XF86MonBrightnessDown, exec, brightnessctl set 10%-

bindd = $mod SHIFT, W, Reload waybar, exec, systemctl --user restart waybar.service

# Capture screenshot from selection and copy to clip board.
bindr= SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bindr= CTRL , Print, exec, grim -g "$(hyprctl clients -j | jq -r '.[] | select(.focusHistoryID == 0) | "\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')"
# Below does not work in all cases because it produces a png, and some apps are picky about only jpeg.
# bindr = SHIFT, Print, exec, hyprshot -m region --clipboard-only
# bindr = , Print, exec, hyprshot -m output
# bindr = CTRL SHIFT, Print, exec, hyprshot -m window

bind = CTRL ALT, e, exec, emote

bind = $mod SHIFT, n, exec, swaync-client --toggle-panel --skip-wait

# Desktop zoom.
bind = $mod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 1.06) | if . > 6 then 6 else . end')
bind = $mod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.94) | if . < 1 then 1 else . end')

binde = $mod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.06 | if . > 6 then 6 else . end')
binde = $mod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.94) | if . < 1 then 1 else . end')
binde = $mod, KP_ADD, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.06 | if . > 6 then 6 else .')
binde = $mod, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.94) | if . < 1 then 1 else . end')

bind = $mod SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, equal, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, minus, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, KP_ADD, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mod SHIFT, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor 1
